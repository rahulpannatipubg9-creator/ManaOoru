name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev/*", "feature/*" ]
    paths:
      - '.github/workflows/build_ios_ipa.yml'

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 SDK for Godot 4.7.2)
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install Godot 4.7.2 Engine (macOS)
        run: |
          mkdir -p .ci
          curl -fsSL -o .ci/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q .ci/godot.zip -d .ci
          GODOT_BIN_DIR="$(pwd)/.ci/Godot.app/Contents/MacOS"
          echo "$GODOT_BIN_DIR" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
          sudo ln -sf "$GODOT_BIN_DIR/Godot" /usr/local/bin/godot || true
          sudo ln -sf "$GODOT_BIN_DIR/Godot" /usr/local/bin/Godot || true
          "$GODOT_BIN_DIR/Godot" --version

      - name: Install Godot Export Templates
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -fsSL -o .ci/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q .ci/templates.tpz -d .ci/templates_extract
          find .ci/templates_extract -type f -exec mv {} "$TEMPLATE_DIR/" \;
          rm -rf .ci/templates.tpz .ci/templates_extract
          ls -la "$TEMPLATE_DIR"

      - name: Export iOS Xcode Project from Godot
        run: |
          mkdir -p builds/ios
          Godot --headless --export-debug "iOS" builds/ios/ManaOoru.ipa
          ls -la builds/ios

      - name: Patch iOS Metal-cpp Compatibility Stubs
        run: |
          cat << 'EOF' >> builds/ios/ManaOoru/dummy.cpp

#include <CoreFoundation/CoreFoundation.h>

extern "C" {
    const void *CADynamicRangeAutomatic = (const void *)CFSTR("CADynamicRangeAutomatic");
    const void *CADynamicRangeConstrainedHigh = (const void *)CFSTR("CADynamicRangeConstrainedHigh");
    const void *CADynamicRangeHigh = (const void *)CFSTR("CADynamicRangeHigh");
    const void *CADynamicRangeStandard = (const void *)CFSTR("CADynamicRangeStandard");
    const void *MTLTensorDomain = (const void *)CFSTR("MTLTensorDomain");
}
EOF
          tail -n 20 builds/ios/ManaOoru/dummy.cpp

      - name: Compile Native iOS Project (Xcode)
        run: |
          cd builds/ios
          xcodebuild -project ManaOoru.xcodeproj \
                     -scheme ManaOoru \
                     -configuration Debug \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          ls -la build_output/Build/Products/Debug-iphoneos/

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -r builds/ios/build_output/Build/Products/Debug-iphoneos/ManaOoru.app Payload/
          zip -r ManaOoru.ipa Payload
          ls -lh ManaOoru.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManaOoru-iOS-IPA
          path: ManaOoru.ipa
          retention-days: 14
