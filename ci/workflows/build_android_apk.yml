name: Build & Test Android Cloud APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      export_type:
        description: "Export build type (debug, release, or all)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - all

jobs:
  test-and-build:
    name: Headless Regression Tests & Android Export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Godot Engine and Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates/4.3-stable
          key: godot-4.3-stable-templates

      - name: Install Godot 4.3 Engine Headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Godot 4.3 stable Linux binary..."
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          sudo mv /tmp/godot_bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -rf /tmp/godot.zip /tmp/godot_bin

      - name: Install Godot 4.3 Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Godot 4.3 export templates..."
          mkdir -p ~/.local/share/godot/export_templates/4.3-stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* ~/.local/share/godot/export_templates/4.3-stable/
          rm -rf /tmp/templates.tpz /tmp/templates_extract

      - name: Configure Godot Android Settings
        run: |
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource format=3]

          [resource]
          export/android/sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Generate Keystores
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi
          mkdir -p builds
          if [ ! -f builds/manaooru-release.keystore ]; then
            keytool -genkeypair -v -keystore builds/manaooru-release.keystore -alias manaooru -keyalg RSA -keysize 2048 -validity 10000 -storepass manaooru2026 -keypass manaooru2026 -dname "CN=ManaOoru,OU=Dev,O=ManaOoru,L=Godavarikhani,ST=Telangana,C=IN"
          fi

      - name: Run Movement Regression Quality Gate
        run: |
          godot --headless --path . --script tests/movement_regression.gd

      - name: Run Device Performance Manager Regression
        run: |
          godot --headless --path . --script tests/device_performance_manager_regression.gd

      - name: Run High Speed Streaming Regression
        run: |
          godot --headless --path . --script tests/high_speed_streaming_regression.gd

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.export_type == 'debug' || github.event.inputs.export_type == 'all' || github.event.inputs.export_type == '' }}
        run: |
          mkdir -p builds
          godot --headless --export-debug "Android" builds/ManaOoru-debug.apk

      - name: Build Android Release APK
        if: ${{ github.event.inputs.export_type == 'release' || github.event.inputs.export_type == 'all' }}
        run: |
          mkdir -p builds
          godot --headless --export-release "Android" builds/ManaOoru-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManaOoru-Android-APK
          path: builds/*.apk
          retention-days: 14
